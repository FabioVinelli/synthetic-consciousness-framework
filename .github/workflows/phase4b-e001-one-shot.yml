name: phase4b-e001-one-shot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  execute-e001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python - <<'PY'
          from importlib.metadata import version
          import platform
          print("python", platform.python_version())
          for p in ("jsonschema", "rfc3339-validator", "pytest"):
              print(p, version(p))
          PY

      - name: Verify protocol lock before execution
        run: |
          python - <<'PY'
          from pathlib import Path
          from benchmarks.runner.__main__ import verify_lock
          print(verify_lock(Path.cwd()))
          PY

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Execute independent E001 runs
        run: |
          rm -rf /tmp/e001-run-a /tmp/e001-run-b /tmp/e001-analysis-b
          python -m benchmarks.runner run --protocol-commit 1a9a159da042df09f63da795725d7ba7ea772d04 --output /tmp/e001-run-a
          python -m benchmarks.runner run --protocol-commit 1a9a159da042df09f63da795725d7ba7ea772d04 --output /tmp/e001-run-b
          python -m benchmarks.runner verify /tmp/e001-run-a /tmp/e001-run-b

      - name: Promote immutable canonical raw results
        run: |
          test ! -e experiments/E001_deterministic_baseline/raw
          cp -a /tmp/e001-run-a experiments/E001_deterministic_baseline/raw
          python -m benchmarks.runner verify experiments/E001_deterministic_baseline/raw

      - name: Generate and reproduce analysis from raw only
        run: |
          python -m benchmarks.runner analyze --raw experiments/E001_deterministic_baseline/raw/results.jsonl --output experiments/E001_deterministic_baseline/analysis
          python -m benchmarks.runner analyze --raw experiments/E001_deterministic_baseline/raw/results.jsonl --output /tmp/e001-analysis-b
          cmp experiments/E001_deterministic_baseline/analysis/summary.json /tmp/e001-analysis-b/summary.json
          cmp experiments/E001_deterministic_baseline/analysis/report.md /tmp/e001-analysis-b/report.md

      - name: Record reproducibility evidence
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("experiments/E001_deterministic_baseline")
          a = pathlib.Path("/tmp/e001-run-a")
          b = pathlib.Path("/tmp/e001-run-b")
          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          ma=json.loads((a/"manifest.json").read_text())
          mb=json.loads((b/"manifest.json").read_text())
          evidence={
              "protocol_commit":"1a9a159da042df09f63da795725d7ba7ea772d04",
              "run_a_manifest_sha256":sha(a/"manifest.json"),
              "run_b_manifest_sha256":sha(b/"manifest.json"),
              "run_a_results_sha256":sha(a/"results.jsonl"),
              "run_b_results_sha256":sha(b/"results.jsonl"),
              "manifests_identical":ma==mb,
              "results_identical":(a/"results.jsonl").read_bytes()==(b/"results.jsonl").read_bytes(),
              "trace_inventory_identical":ma["files"]==mb["files"],
              "trial_count":ma["trials"],
          }
          (root/"analysis"/"reproducibility.json").write_text(json.dumps(evidence,sort_keys=True,separators=(",",":"))+"\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Final verification
        run: |
          python -m pytest -q
          python - <<'PY'
          from pathlib import Path
          from benchmarks.runner.__main__ import verify_lock, verify_raw
          print("lock", verify_lock(Path.cwd()))
          print("raw_trials", verify_raw(Path("experiments/E001_deterministic_baseline/raw"))["trials"])
          PY

      - name: Commit generated Phase-4B artifacts
        run: |
          rm .github/workflows/phase4b-e001-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/E001_deterministic_baseline/raw experiments/E001_deterministic_baseline/analysis
          git add -u .github/workflows/phase4b-e001-one-shot.yml
          git commit -m "feat: execute E001 deterministic CAFH benchmark"
          git push origin HEAD:main
