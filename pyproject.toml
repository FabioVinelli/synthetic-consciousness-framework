[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cafh"
version = "0.1.0"
description = "Deterministic reference runtime for SCF computational mechanisms"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "rfc3339-validator>=0.1.4,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cafh*", "benchmarks*"]

[tool.setuptools.data-files]
"share/cafh" = ["schemas/conscious_state.schema.json"]

[tool.setuptools.package-data]
"benchmarks.tasks" = ["v0_1.json"]
